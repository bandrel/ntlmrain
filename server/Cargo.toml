[package]
name = "ntlmrain-server"
version = "0.1.0"
edition = "2024"
description = "NetNTLMv1 rainbow-table lookup service"
license = "Apache-2.0"

[dependencies]
ntlmrain = { path = ".." }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["timeout", "catch-panic"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ntlmrain-server"
path = "src/main.rs"
